<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <div class="container">
        <h1>Weather App</h1>

        <div class="search">
            <input id="city" type="text" placeholder="Enter city name">
            <button id="btn">Search</button>
        </div>

        <p id="message"></p>

        <img id="icon" src="" alt="">
        <h1 id="temp">--°C</h1>
        <h2 id="name">--</h2>
        <p id="description">--</p>

        <div class="details">
            <div class="box">
                <p class="value" id="humidity">--%</p>
                <p class="label">Humidity</p>
            </div>

            <div class="box">
                <p class="value" id="wind">-- km/h</p>
                <p class="label">Wind Speed</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
